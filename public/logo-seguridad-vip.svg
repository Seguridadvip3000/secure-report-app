<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Escudo exterior -->
  <path d="M 256 80 L 380 140 L 380 280 Q 380 380 256 432 Q 132 380 132 280 L 132 140 Z" 
        fill="#fbbf24" stroke="#f59e0b" stroke-width="8"/>
  
  <!-- Escudo interior -->
  <path d="M 256 120 L 350 165 L 350 270 Q 350 350 256 390 Q 162 350 162 270 L 162 165 Z" 
        fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Checkmark -->
  <path d="M 200 256 L 240 296 L 312 216" 
        stroke="#fbbf24" stroke-width="20" fill="none" 
        stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Texto VIP -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="#fbbf24" text-anchor="middle">VIP 3000</text>
</svg>