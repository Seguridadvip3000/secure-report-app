name: Compilar Apps Seguridad VIP 3000 (Nativo)
on:
  push:
    branches:
      - master
jobs:
  build_android:
    name: Compilar APK Directo en GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código y Logo Oficial
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17 (Requerido por Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear Entorno Móvil y Procesar Ícono Oficial VIP 3000
        run: |
          if [ ! -f logo-vip3000.jpg ]; then
            echo "❌ ERROR CRÍTICO: No se encontró logo-vip3000.jpg en la raíz del repositorio."
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y imagemagick
          npx create-expo-app@latest app-movil-limpia --template blank
          if [ -f App.js ]; then cp App.js app-movil-limpia/App.js; fi
          mkdir -p app-movil-limpia/assets
          convert logo-vip3000.jpg -resize 1024x1024 -background "#0f172a" -gravity center -extent 1024x1024 PNG32:app-movil-limpia/assets/icon.png

      - name: Instalar Librerías Nativas (WebView, Cámara, Galería, GPS y PDF)
        working-directory: ./app-movil-limpia
        run: npx expo install react-native-webview expo-file-system expo-sharing expo-image-picker expo-location

      - name: Configurar app.json con Ícono Oficial y Permisos Completos
        working-directory: ./app-movil-limpia
        run: |
          echo '{
            "expo": {
              "name": "SecureReport",
              "slug": "secure-report-app",
              "version": "1.0.0",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "userInterfaceStyle": "dark",
              "android": {
                "adaptiveIcon": {
                  "foregroundImage": "./assets/icon.png",
                  "backgroundColor": "#0f172a"
                },
                "package": "com.seguridadvip3000.securereport",
                "permissions": [
                  "ACCESS_COARSE_LOCATION",
                  "ACCESS_FINE_LOCATION",
                  "CAMERA",
                  "READ_EXTERNAL_STORAGE",
                  "WRITE_EXTERNAL_STORAGE",
                  "READ_MEDIA_IMAGES"
                ]
              }
            }
          }' > app.json

      - name: Generar Proyecto Nativo Android (Prebuild)
        working-directory: ./app-movil-limpia
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK Release con Gradle
        working-directory: ./app-movil-limpia/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Subir APK Final Listo para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: SecureReport-VIP3000-APK
          path: app-movil-limpia/android/app/build/outputs/apk/release/app-release.apk
