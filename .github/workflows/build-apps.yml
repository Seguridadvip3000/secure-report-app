name: Compilar Apps Seguridad VIP 3000 (Nativo)
on:
  push:
    branches:
      - master
jobs:
  build_android:
    name: Compilar APK Directo en GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17 (Requerido por Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear Entorno Móvil Limpio y Descargar Logo Oficial
        run: |
          npx create-expo-app@latest app-movil-limpia --template blank
          if [ -f App.js ]; then cp App.js app-movil-limpia/App.js; fi
          mkdir -p app-movil-limpia/assets
          curl -sL "https://vercel.app" -o app-movil-limpia/assets/icon.png
      - name: Instalar Librerías Nativas (WebView y Archivos PDF)
        working-directory: ./app-movil-limpia
        run: npx expo install react-native-webview expo-file-system expo-sharing

      - name: Configurar app.json con Ícono Oficial y Permisos
        working-directory: ./app-movil-limpia
        run: |
          echo '{
            "expo": {
              "name": "SecureReport",
              "slug": "secure-report-app",
              "version": "1.0.0",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "userInterfaceStyle": "dark",
              "android": {
                "adaptiveIcon": {
                  "foregroundImage": "./assets/icon.png",
                  "backgroundColor": "#0f172a"
                },
                "package": "com.seguridadvip3000.securereport",
                "permissions": [
                  "ACCESS_COARSE_LOCATION",
                  "ACCESS_FINE_LOCATION",
                  "CAMERA",
                  "READ_EXTERNAL_STORAGE",
                  "WRITE_EXTERNAL_STORAGE"
                ]
              }
            }
          }' > app.json
      - name: Generar Proyecto Nativo Android (Prebuild)
        working-directory: ./app-movil-limpia
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK Release con Gradle
        working-directory: ./app-movil-limpia/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Subir APK Final Listo para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: SecureReport-VIP3000-APK
          path: app-movil-limpia/android/app/build/outputs/apk/release/app-release.apk
