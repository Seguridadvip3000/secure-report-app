name: Compilar Apps Seguridad VIP 3000
on:
  push:
    branches:
      - master
jobs:
  build_android:
    name: Compilar para Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar EAS CLI global
        run: npm install -g eas-cli
      - name: Crear Entorno Móvil Limpio y Aislado
        run: |
          npx create-expo-app@latest app-movil-limpia --template blank
          if [ -f App.js ]; then cp App.js app-movil-limpia/App.js; fi
      - name: Configurar app.json y eas.json en el Entorno Limpio
        working-directory: ./app-movil-limpia
        run: |
          echo '{
            "expo": {
              "name": "SecureReport",
              "slug": "secure-report-app",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "dark",
              "android": {
                "package": "com.seguridadvip3000.securereport"
              }
            }
          }' > app.json

          echo '{
            "cli": { 
              "version": ">= 12.0.0",
              "appVersionSource": "remote"
            },
            "build": {
              "production": {
                "android": { "buildType": "apk" }
              }
            }
          }' > eas.json
      - name: Vincular Proyecto en Expo
        working-directory: ./app-movil-limpia
        run: eas init --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Compilar APK en Expo
        working-directory: ./app-movil-limpia
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
