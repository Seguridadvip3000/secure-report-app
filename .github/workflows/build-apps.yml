name: Compilar Apps Seguridad VIP 3000
on:
  push:
    branches:
      - master
jobs:
  build_android:
    name: Compilar para Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4
      - name: Limpiar Directorio de Trabajo
        run: |
          rm -f package.json package-lock.json vite.config.js index.html
          rm -rf src public scripts .github/workflows/old 2>/dev/null || true
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar EAS CLI global
        run: npm install -g eas-cli
      - name: Generar Estructura Móvil Base
        run: |
          npx create-expo-app@latest secure-report-tmp --template blank --no-install
          mv secure-report-tmp/* ./ 2>/dev/null || true
          mv secure-report-tmp/.* ./ 2>/dev/null || true
          rm -rf secure-report-tmp
      - name: Reinyectar app.json y eas.json Correctos
        run: |
          echo '{
            "expo": {
              "name": "SecureReport",
              "slug": "secure-report-app",
              "version": "1.0.0",
              "extra": {
                "eas": {
                  "projectId": "cd454b67-4bb9-4bd9-9430-10904d9c73ef"
                }
              }
            }
          }' > app.json

          echo '{
            "cli": { "version": ">= 12.0.0" },
            "build": {
              "production": {
                "android": { "buildType": "apk" }
              }
            }
          }' > eas.json
      - name: Instalar Dependencias del Entorno Móvil
        run: npm install --legacy-peer-deps
      - name: Compilar APK en Expo
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
